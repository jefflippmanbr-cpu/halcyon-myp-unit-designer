# Render Blueprint — deploys the Halcyon MYP Unit Designer as a single Node service.
# The Express server serves both the built frontend and the /api routes, so one service
# is all that's needed. Secrets are NOT in this file: sync:false means Render prompts you
# for the value in its dashboard and stores it encrypted.
services:
  - type: web
    name: halcyon-myp-unit-designer
    runtime: node
    plan: starter          # "free" also works, but sleeps after ~15 min idle (slow first load)
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/config
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # paste your key into the Render dashboard
      - key: APP_PASSWORD
        sync: false        # the shared staff password
      - key: SESSION_SECRET
        generateValue: true  # Render generates a strong random value and keeps it stable
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: SESSION_HOURS
        value: "12"
      - key: NODE_VERSION
        value: "20"
